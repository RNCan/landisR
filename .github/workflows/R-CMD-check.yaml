name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out Biomass Succession
        uses: actions/checkout@v4
        with:
          repository: RNCan/landisR.succession.biomass
          ref: 764f34810fa498345a0763bc191e71d7f5d56488
          path: .github/biomass-succession
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Biomass Succession is installed from GitHub after the local core.
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::terra, any::testthat, any::rmarkdown
          needs: check

      - name: Install the local core and Biomass Succession
        shell: Rscript {0}
        run: |
          # Biomass Succession uses the headers from the core being checked.
          r <- file.path(R.home("bin"), if (.Platform$OS.type == "windows") "R.exe" else "R")
          for (source in c(".", ".github/biomass-succession")) {
            status <- system2(r, c("CMD", "INSTALL", "--clean", shQuote(source)))
            if (status != 0L) stop("Installation failed: ", source)
          }
          loadNamespace("landisR.succession.biomass")

      - name: R CMD check
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c('--no-manual'),
            error_on = 'warning',
            check_dir = 'check'
          )
